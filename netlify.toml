[build]
  command = "curl -sSL https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz | tar -xz -C \"$HOME\" && \"$HOME/quarto-${QUARTO_VERSION}/bin/quarto\" render"
  publish = "_site"

[build.environment]
  QUARTO_VERSION = "1.6.40"
