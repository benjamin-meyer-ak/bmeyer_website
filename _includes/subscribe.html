<div class="subscribe-box border rounded p-3 my-4">
  <h4 class="mb-2">Subscribe</h4>
  <p class="mb-2">New posts by email, occasionally. No spam, unsubscribe any time.</p>
  <form action="BREVO_FORM_URL" method="POST" target="_blank" class="row g-2">
    <div class="col-sm-8">
      <input type="email" name="EMAIL" class="form-control" placeholder="you@example.com" aria-label="Email address" required>
    </div>
    <div class="col-sm-4">
      <button type="submit" class="btn btn-primary w-100">Subscribe</button>
    </div>
  </form>
</div>
